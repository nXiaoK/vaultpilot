            "$ref": "#/components/schemas/Snapshot"
        commit_id:
          type: string
        deleted_at:
          type: string
          format: date-time
        protection_status:
          type: string
          enum:
          - complete
          - degraded
      required:
      - id
      - version
      - status
      - protected
      - file_count
      - logical_bytes
      - snapshots
      - commit_id
    RecoveryPointPage:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/RecoveryPoint"
        total:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - total
    FileEntry:
      type: object
      properties:
        source_id:
          type: string
        path:
          type: string
          description: 该源相对路径；根目录为空
        kind:
          type: string
          enum:
          - file
          - dir
          - symlink
        size:
          type: integer
          format: int64
          minimum: 0
        mtime_ns:
          type: integer
          format: int64
        mode:
          type: integer
          format: int64
          minimum: 0
        link_target:
          type: string
        repository_id:
          type: string
        snapshot_path:
          type: string
          description: 该恢复点映射到Restic快照的实际路径
      required:
      - source_id
      - path
      - kind
      - size
      - mtime_ns
      - mode
      - repository_id
      - snapshot_path
    FileEntryPage:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/FileEntry"
        total:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - total
    ProtectRequest:
      type: object
      properties:
        protected:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
      required:
      - protected
      - version
    ProtectionDegraded:
      type: object
      properties:
        point:
          "$ref": "#/components/schemas/RecoveryPoint"
        error:
          type: string
        code:
          type: string
          const: PROTECTION_DEGRADED
        retryable:
          type: boolean
          const: true
      required:
      - point
      - error
      - code
      - retryable
    PathSelection:
      type: object
      properties:
        source_id:
          type: string
        path:
          type: string
          description: 源内相对路径，空字符串选择整个源
      required:
      - source_id
    RestoreRequest:
      type: object
      properties:
        point_id:
          type: string
        source_ids:
          type: array
          items:
            type: string
        paths:
          anyOf:
          - type: array
            items:
              "$ref": "#/components/schemas/PathSelection"
          - type: array
            items:
              type: string
              description: 兼容形式：source_id/relative/path
        target:
          type: string
          description: RestoreRoots允许范围内的绝对路径
        layout:
          type: string
          enum:
          - auto
          - direct
          - by_source
          default: auto
          description: auto按实际所选范围判断：单源直接写入target/原相对路径，多源写入target/source_id/原相对路径。direct仅允许最多一个备份源，否则返回RESTORE_LAYOUT_REQUIRES_SINGLE_SOURCE；by_source保留按源分目录布局。
        overwrite:
          type: boolean
          default: false
        allow_partial:
          type: boolean
          default: false
      description: 省略source_ids和paths表示整个点；两个范围同时指定时取交集。默认layout=auto，不覆盖已有文件，不允许部分恢复。
      required:
      - point_id
      - target
    RestoreOutputRoot:
      type: object
      description: 实际选中的备份源及其恢复输出目录；历史路径仍相对于备份源。
      properties:
        source_id:
          type: string
        path:
          type: string
          description: 该源的实际输出绝对目录。direct为target，by_source为target/source_id。
      required:
      - source_id
      - path
    RestoreFailureEntry:
      type: object
      properties:
        source_id:
          type: string
        path:
          type: string
          description: 源内逻辑相对路径
        code:
          type: string
          description: 该条目失败的稳定错误码
        stage:
          type: string
          description: 失败发生阶段
        error:
          type: string
      required:
      - source_id
      - path
      - code
      - stage
    RestoreResult:
      type: object
      description: restore任务实际执行后的result。成功复制部分条目后失败会标记partial_failed并保留原稳定code；预检查直接拒绝可能尚无result。计数按恢复清单条目，包括目录和链接。
      properties:
        restored:
          type: integer
          format: int64
          minimum: 0
        skipped:
          type: integer
          format: int64
          minimum: 0
        conflicts:
          type: integer
          format: int64
          minimum: 0
        failed:
          type: integer
          format: int64
          minimum: 0
        unattempted:
          type: integer
          format: int64
          minimum: 0
        verification_errors:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
          description: 已识别校验异常数。无法区分引擎错误发生在恢复或校验阶段时为null，不能显示为零异常。
        verification_status:
          type: string
          enum:
          - passed
          - not_started
          - partial
          - unknown
          - failed
        failure_entries:
          type: array
          items:
            "$ref": "#/components/schemas/RestoreFailureEntry"
        failure_entry_count:
          type: integer
          format: int64
          minimum: 0
          description: 全部异常条目数量，不限于当前返回列表
        failure_entries_truncated:
          type: boolean
          description: 异常条目列表是否被截断
        target:
          type: string
        layout:
          type: string
          enum:
          - direct
          - by_source
          description: 已解析的实际输出布局
        output_roots:
          type: array
          items:
            "$ref": "#/components/schemas/RestoreOutputRoot"
        point_id:
          type: string
        verification:
          type: string
          description: 实际校验方式说明
      required:
      - restored
      - skipped
      - conflicts
      - failed
      - unattempted
      - verification_errors
      - verification_status
      - failure_entries
      - failure_entry_count
      - failure_entries_truncated
      - target
      - layout
      - output_roots
      - point_id
      - verification
    RestorePreview:
      type: object
      properties:
        file_count:
          type: integer
          format: int64
          minimum: 0
        logical_bytes:
          type: integer
          format: int64
          minimum: 0
        required_bytes:
          type: integer
          format: int64
          minimum: 0
        conflicts:
          type: array
          description: 冲突path为源内相对路径，实际位置由对应output_roots.path拼接得到。
          items:
            "$ref": "#/components/schemas/PathSelection"
        conflict_count:
          type: integer
          format: int64
          minimum: 0
        missing_accounts:
          type: array
          items:
            type: string
        missing_files:
          type: array
          items:
            "$ref": "#/components/schemas/PathSelection"
        missing_file_count:
          type: integer
          format: int64
          minimum: 0
        target:
          type: string
        layout:
          type: string
          enum:
          - direct
          - by_source
          description: 已解析的实际输出布局
        output_roots:
          type: array
          items:
            "$ref": "#/components/schemas/RestoreOutputRoot"
        allow_partial:
          type: boolean
        blocked:
          type: boolean
        code:
          type: string
      description: conflicts与missing_files各最多展示200条，计数提供完整总数。
      required:
      - file_count
      - logical_bytes
      - required_bytes
      - conflicts
      - conflict_count
      - missing_accounts
      - missing_files
      - missing_file_count
      - target
      - layout
      - output_roots
      - allow_partial
      - blocked
    CheckRequest:
      type: object
      properties:
        repository_ids:
          type: array
          items:
            type: string
          description: 省略或空数组检查全部登记仓库
        mode:
          type: string
          enum:
          - structure
          - sample
          - full
          default: structure
        sample:
          type: string
          default: 10%
          description: 仅sample模式使用，采用Restic支持的抽样表达式
    RetentionPreviewRequest:
      type: object
      properties:
        plan_id:
          type: string
      required:
      - plan_id
    RetentionRequest:
      type: object
      properties:
        plan_id:
          type: string
        point_ids:
          type: array
          items:
            type: string
          description: 空数组只重试本计划已提交的仓库数据回收；已完成回收的计划再次重试会幂等成功。
        confirm:
          type: boolean
          const: true
      description: 实际执行重新计算全局引用及保留集合，拒绝受保护点或仍需保留的点。提交前检查账号可用及维护预留；RETENTION_ACCOUNT_UNAVAILABLE 或 MAINTENANCE_RESERVE_REQUIRED 不会发布新的删除决策。RETENTION_ENGINE_FAILED 保留待回收清单，可用空 point_ids 重试。未完成备份等阻塞项仍返回 RETENTION_PAUSED；从未清理且无待回收数据时空选择返回 EMPTY_RETENTION_SELECTION。
      required:
      - plan_id
      - point_ids
      - confirm
    RetentionPreview:
      type: object
      properties:
        plan_id:
          type: string
        keep_ids:
          type: array
          items:
            type: string
        delete_ids:
          type: array
          items:
            type: string
        snapshots:
          type: array
          items:
            "$ref": "#/components/schemas/Snapshot"
        pending_prune_repositories:
          type: integer
          minimum: 0
          description: 本计划存在待重试数据回收的仓库数
        blocked:
          type: boolean
        reasons:
          type: array
          items:
            type: string
      required:
      - plan_id
      - keep_ids
      - delete_ids
      - snapshots
      - pending_prune_repositories
      - blocked
      - reasons
    MigrateRepositoryRequest:
      type: object
      properties:
        repository_id:
          type: string
        target_account_id:
          type: string
        confirm:
          type: boolean
          const: true
        cleanup_old:
          type: boolean
          const: false
          default: false
      required:
      - repository_id
      - target_account_id
      - confirm
    CleanupOldCopyRequest:
      type: object
      properties:
        repository_id:
          type: string
        cleanup_old:
          type: boolean
          const: true
        old_location_index:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: 来自locations数组的下标；未指定时服务器默认为0
        old_location_path:
          type: string
          description: 建议同时提供读取到的路径，变化时拒绝操作
        confirm:
          type: boolean
          const: true
      required:
      - repository_id
      - cleanup_old
      - confirm
    MigrationRequest:
      oneOf:
      - "$ref": "#/components/schemas/MigrateRepositoryRequest"
      - "$ref": "#/components/schemas/CleanupOldCopyRequest"
      description: 正常迁移保留旧副本；cleanup_old=true是另一次明确确认后的旧副本清理，先验证新位置及引用，再登记退休并提交目录，最后删除旧位置。

    AccountClearSelection:
      type: object
      required: [account_ids]
      properties:
        account_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1}
    TelegramSettingsRequest:
      type: object
      required: [version, enabled, chat_id, node_name, backup_success, backup_failure, account_error]
      properties:
        version: {type: integer, minimum: 0}
        enabled: {type: boolean}
        bot_token: {type: string, writeOnly: true, description: 留空保留；新 Token 必须符合 BotFather 格式}
        clear_token: {type: boolean, default: false}
        chat_id: {type: string, description: 个人用户正整数 ID；禁用时可为空}
        node_name: {type: string, maxLength: 80}
        backup_success: {type: boolean}
        backup_failure: {type: boolean, description: 包括取消与重启中断}
        account_error: {type: boolean}
    TelegramSettings:
      type: object
      properties:
        version: {type: integer}
        enabled: {type: boolean}
        token_configured: {type: boolean}
        chat_id: {type: string}
        node_name: {type: string}
        backup_success: {type: boolean}
        backup_failure: {type: boolean}
        account_error: {type: boolean}
        health_interval_minutes: {type: integer, const: 15}
        queued_count: {type: integer}
        failed_count: {type: integer}
        recent:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              id: {type: string}
              kind: {type: string, enum: [test, backup_success, backup_failure, account_error]}
              status: {type: string, enum: [queued, sent, failed, cancelled]}
              attempts: {type: integer}
              created_at: {type: string, format: date-time}
              sent_at: {type: string, description: 未发送时为空}
              last_error: {type: string, description: 脱敏发送失败说明，不含原始接口错误}
    AccountClearRequest:
      allOf:
      - "$ref": "#/components/schemas/AccountClearSelection"
      - type: object
        required: [preview_token, confirmation]
        properties:
          preview_token: {type: string, pattern: '^[a-f0-9]{64}$'}
          confirmation: {type: string, const: 清空所选备份}
    AccountClearPreview:
      type: object
      required: [vault_id, path, items, repository_ids, point_ids, protected_point_ids, pause_plan_ids, catalog_account_count, blocked, reasons, preview_token, resume]
      properties:
        vault_id: {type: string}
        path: {type: string, description: 当前库目录；不接受客户端自定义路径}
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              email: {type: string}
              drive_id: {type: string}
              estimated_bytes: {type: integer, description: 上次查询的项目占用，不是实时测量或保证释放空间}
              permanent_delete: {type: boolean, description: gdrive为true，备份永久删除、不进入回收站、无法找回}
        repository_ids: {type: array, items: {type: string}}
        point_ids: {type: array, items: {type: string}}
        protected_point_ids: {type: array, items: {type: string}}
        pause_plan_ids: {type: array, items: {type: string}}
        catalog_account_count: {type: integer}
        blocked: {type: boolean}
        reasons: {type: array, items: {type: string}}
        preview_token: {type: string}
        resume: {type: boolean}
