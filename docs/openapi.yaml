      operationId: relay_rclone_callback
      tags: [账号]
      security:
      - SessionAuth: []
        CSRFToken: []
      parameters:
      - "$ref": "#/components/parameters/ResourceID"
      - {name: flow_id, in: query, required: true, schema: {type: string}}
      description: 请求目标始终为进程内部 loopback，校验 state、原会话、到期及一次使用状态。禁止跟随重定向。请求体包含临时授权码，不记录或回传。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, maxLength: 65536}
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '202': {description: 已提交，继续轮询授权状态}
        '400': {"$ref": "#/components/responses/APIError"}
        '409': {"$ref": "#/components/responses/APIError"}
