        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '404':
          "$ref": "#/components/responses/APIError"
        '409':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
        '502':
          "$ref": "#/components/responses/APIError"
      description: 先检查账号可用及维护预留，再提交全局删除决策及待回收清单，最后 forget/prune。空 point_ids 重试已提交的数据回收，任务结果包含 deleted_point_ids、pruned_repositories、cleanup_pending。保护点、挂载异常、异常减少和持续失败会阻止清理及重试；恢复节点拒绝。
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
