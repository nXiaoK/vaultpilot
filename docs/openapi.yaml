---
openapi: 3.1.0
info:
  title: VaultPilot API
  version: 1.0.0
  description: 实现参考。所有Bytes为整数，列表分页；管理会话Cookie + X-CSRF-Token。OneDrive Personal与个人Google Drive实际云端联调状态见测试报告，企业版/SharePoint/Google Workspace/共享云端硬盘不宣称兼容。资源修改用version，后台任务用Idempotency-Key。
servers:
- url: "/api"
security:
- SessionAuth: []
tags:
- name: 安全
- name: 账号
- name: 存储池
- name: 目录
- name: 计划
- name: 任务
- name: 恢复
- name: 维护
- name: 通知
paths:
  "/notifications/telegram":
    get:
      summary: 读取本节点 Telegram 设置与最近发送状态，不回显 Token
      operationId: get_telegram_notifications
      tags: [通知]
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 脱敏设置、队列统计与最近十条记录
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/TelegramSettings"}
        '401': {"$ref": "#/components/responses/APIError"}
    put:
      summary: 保存 Telegram 通知设置，Token 使用节点密钥加密
      operationId: save_telegram_notifications
      tags: [通知]
      security: [{SessionAuth: [], CSRFToken: []}]
      description: version 必须匹配；bot_token 留空保留现值。启用时必须有有效 Token、个人数字 Chat ID 及至少一类事件。更换 Token/接收用户或关闭通知取消旧待发通知；在途请求可能完成。设置不随恢复包或账号迁移。
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/TelegramSettingsRequest"}
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 保存成功后的脱敏设置
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/TelegramSettings"}
        '400': {"$ref": "#/components/responses/APIError"}
        '401': {"$ref": "#/components/responses/APIError"}
        '403': {"$ref": "#/components/responses/APIError"}
        '409': {"$ref": "#/components/responses/APIError"}
  "/notifications/telegram/test":
    post:
      summary: 使用已保存配置排队测试通知，每分钟最多三次
      operationId: test_telegram_notifications
      tags: [通知]
      security: [{SessionAuth: [], CSRFToken: []}]
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '202':
          description: 已排队，不代表已送达
          content:
            application/json:
              schema:
                type: object
                properties: {id: {type: string}, status: {type: string, const: queued}}
        '401': {"$ref": "#/components/responses/APIError"}
        '403': {"$ref": "#/components/responses/APIError"}
        '409': {"$ref": "#/components/responses/APIError"}
        '429': {"$ref": "#/components/responses/APIError"}
  "/notifications/telegram/retry":
    post:
      summary: 将当前接收配置下失败通知重新排队
      operationId: retry_telegram_notifications
      tags: [通知]
      security: [{SessionAuth: [], CSRFToken: []}]
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '202': {description: 重试已提交}
        '401': {"$ref": "#/components/responses/APIError"}
        '403': {"$ref": "#/components/responses/APIError"}
        '409': {"$ref": "#/components/responses/APIError"}
  "/notifications/telegram/check-accounts":
    post:
      summary: 后台只读检查启用且已验证的云盘账号，授权异常去重通知
      operationId: check_telegram_account_authorizations
      tags: [通知]
      security: [{SessionAuth: [], CSRFToken: []}]
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '202': {description: 检查已提交}
        '401': {"$ref": "#/components/responses/APIError"}
        '403': {"$ref": "#/components/responses/APIError"}
        '409': {"$ref": "#/components/responses/APIError"}
  "/status":
    get:
      summary: 初始化、身份、密钥、引擎及部署限制状态
      operationId: get_status
      tags:
      - 安全
      security: []
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 初始化、身份、密钥、引擎及部署限制状态
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Status"
        '400':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
  "/setup":
    post:
      summary: 创建备份库、导入恢复包或建立待连接云端恢复节点
      operationId: post_setup
      tags:
      - 安全
      security: []
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '201':
          description: 创建备份库、导入恢复包或建立待连接云端恢复节点
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SetupResult"
        '400':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
        '409':
          "$ref": "#/components/responses/APIError"
      description: 仅未初始化实例可调用，请求体最多1MiB（含恢复包）。成功创建HttpOnly会话Cookie；恢复模式不会初始化已有云端仓库。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SetupRequest"
  "/auth/login":
    post:
      summary: 管理员登录
      operationId: post_auth_login
      tags:
      - 安全
      security: []
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 管理员登录
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '400':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
      description: 请求体最多8KiB，按操作与客户端IP限速；受Origin检查保护。成功设置vaultpilot_session Cookie，会话有效12小时，成功登录清零对应尝试。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
  "/auth/logout":
    post:
      summary: 结束当前会话
      operationId: post_auth_logout
      tags:
      - 安全
      security:
      - SessionAuth: []
        CSRFToken: []
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '204':
          description: 结束当前会话
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '404':
          "$ref": "#/components/responses/APIError"
        '409':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
        '502':
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmptyRequest"
  "/security/unlock":
    post:
      summary: 使用当前节点恢复密码解锁主密钥
      operationId: post_security_unlock
      tags:
      - 安全
      security:
      - SessionAuth: []
        CSRFToken: []
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 使用当前节点恢复密码解锁主密钥
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnlockState"
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '404':
          "$ref": "#/components/responses/APIError"
        '409':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
        '502':
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordRequest"
  "/security/lock":
    post:
      summary: 清除内存中的主密钥
      operationId: post_security_lock
      tags:
      - 安全
      security:
      - SessionAuth: []
        CSRFToken: []
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 清除内存中的主密钥
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnlockState"
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '404':
          "$ref": "#/components/responses/APIError"
        '409':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
        '502':
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmptyRequest"
  "/security/recovery-kit":
    post:
      summary: 导出独立密码保护的离线恢复包
      operationId: post_security_recovery_kit
      tags:
      - 安全
      security:
      - SessionAuth: []
        CSRFToken: []
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 导出独立密码保护的离线恢复包
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RecoveryKit"
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename=vaultpilot-<vault_id>-recovery.json
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '404':
          "$ref": "#/components/responses/APIError"
        '409':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
        '502':
          "$ref": "#/components/responses/APIError"
        '423':
          "$ref": "#/components/responses/APIError"
      description: 需要已解锁并重新验证当前管理员登录密码，请求最多8KiB，失败按reauth操作限速。导出密码不会改变当前节点重启解锁密码。包含定位入口和受保护主密钥，不包含OAuth Token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RecoveryExportRequest"
  "/security/discover":
    post:
      summary: 发现认证提交目录并重建本地索引
      operationId: post_security_discover
      tags:
      - 恢复
      security:
      - SessionAuth: []
        CSRFToken: []
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '202':
          description: 发现认证提交目录并重建本地索引
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Task"
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '404':
          "$ref": "#/components/responses/APIError"
        '409':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
        '502':
          "$ref": "#/components/responses/APIError"
      description: 仅准备文件不会被发布；完成证书冗余不足时标记保护降级。来源Drive必须重新授权并显式验证。
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmptyRequest"
  "/accounts":
    get:
      summary: 账号列表，不返回敏感凭据
      operationId: get_accounts
      tags:
      - 账号
      security:
      - SessionAuth: []
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 账号列表，不返回敏感凭据
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountPage"
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '404':
          "$ref": "#/components/responses/APIError"
        '409':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
        '502':
          "$ref": "#/components/responses/APIError"
      parameters:
      - "$ref": "#/components/parameters/Limit"
      - "$ref": "#/components/parameters/Offset"
    post:
      summary: 创建OneDrive、Google Drive配置或显式启用的本地联调入口
      operationId: post_accounts
      tags:
      - 账号
      security:
      - SessionAuth: []
        CSRFToken: []
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '201':
          description: 创建OneDrive、Google Drive配置或显式启用的本地联调入口
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '404':
          "$ref": "#/components/responses/APIError"
        '409':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
        '502':
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountCreate"
  "/accounts/clear/preview":
    post:
      summary: 预览所选账号当前库的备份清空范围
      operationId: preview_account_clear
      tags: [账号]
      security:
      - SessionAuth: []
        CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountClearSelection"
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 账号、退役仓库、失效恢复点及暂停计划；受保护点或活动任务导致 blocked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountClearPreview"
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
  "/accounts/clear":
    post:
      summary: 提交单账号或批量清空备份任务
      operationId: submit_account_clear
      tags: [账号]
      description: 仅已解锁写入节点。执行时重新核对 preview_token、保护与任务状态；只清理服务器构造的当前库仓库和旧 catalog，保留授权、连接入口与最新删除记录。先暂停计划和同步所有已验证 Drive 的删除目录，再开始删除。失败或重启后必须选择原账号组重试。
      security:
      - SessionAuth: []
        CSRFToken: []
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountClearRequest"
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '202':
          description: account-clear 后台任务，结果记录每个账号的 cleared/error/warning 及 cleanup_pending
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Task"
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '409':
          "$ref": "#/components/responses/APIError"
  "/accounts/export":
    post:
      summary: 导出密码加密的已验证云盘账号包
      operationId: export_accounts
      tags: [账号]
      security:
      - SessionAuth: []
        CSRFToken: []
      description: 必须提供当前管理员登录密码；包保护密码12–1024字节，请求最多8KiB，重新认证失败按reauth操作限速。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountExportRequest"
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 导出密码加密的已验证云盘账号包
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountPackage"
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
  "/accounts/import/preview":
    post:
      summary: 解密账号包并返回不含凭据的预览
      operationId: preview_account_import
      tags: [账号]
      security:
      - SessionAuth: []
        CSRFToken: []
      description: 密码 12–1024 字节，请求最多 2 MiB，密码尝试限速。导入账号仍需调用 verify 重新验证原 Drive。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountImportRequest"
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 解密账号包并返回不含凭据的预览
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountImportPreview"
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
  "/accounts/import":
    post:
      summary: 原子导入所选账号和本地加密凭据，跳过重复 Drive
      operationId: import_accounts
      tags: [账号]
      security:
      - SessionAuth: []
        CSRFToken: []
      description: 密码 12–1024 字节，请求最多 2 MiB，密码尝试限速。导入账号仍需调用 verify 重新验证原 Drive。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountImportRequest"
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '201':
          description: 原子导入所选账号和本地加密凭据，跳过重复 Drive
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountImportResult"
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
  "/accounts/{id}":
    put:
      summary: 修改账号名称、启用状态与预算
      operationId: put_accounts_id
      tags:
      - 账号
      security:
      - SessionAuth: []
        CSRFToken: []
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 修改账号名称、启用状态与预算
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '404':
          "$ref": "#/components/responses/APIError"
        '409':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
        '502':
          "$ref": "#/components/responses/APIError"
      parameters:
      - "$ref": "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountUpdate"
    patch:
      summary: 修改账号名称、启用状态与预算
      operationId: patch_accounts_id
      tags:
      - 账号
      security:
      - SessionAuth: []
        CSRFToken: []
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
