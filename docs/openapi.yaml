        CSRFToken: []
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '202':
          description: 整仓迁移或经再次确认清理旧副本
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Task"
        '400':
          "$ref": "#/components/responses/APIError"
        '401':
          "$ref": "#/components/responses/APIError"
        '403':
          "$ref": "#/components/responses/APIError"
        '404':
          "$ref": "#/components/responses/APIError"
        '409':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
        '500':
          "$ref": "#/components/responses/APIError"
        '502':
          "$ref": "#/components/responses/APIError"
      description: 目标账号必须属于仓库所在计划的存储池，否则任务返回 MIGRATION_TARGET_OUTSIDE_POOL。正常迁移冻结计划/账号/仓库，完整复制及全量读取验证，提交新位置，保留旧副本。cleanup_old是独立确认的破坏性操作；恢复节点拒绝。
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MigrationRequest"
  "/security/cloud-connection":
    get:
      summary: 多节点连接及自动发现状态
      operationId: get_cloud_connection
      tags: [安全]
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 状态不包含密码、密钥或加密连接资料本体
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CloudConnectionState"
    post:
      summary: 写入节点验证原备份密码并发布加密连接入口
      operationId: publish_cloud_connection
      tags: [安全]
      security:
      - SessionAuth: []
        CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CloudPassword"
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 至少一个账号发布和读回成功；失败账号另行报告
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: {type: boolean}
                  verified_accounts: {type: array, items: {type: string}}
                  failed_accounts: {type: array, items: {type: string}}
        '400':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
    put:
      summary: 恢复节点启停每分钟自动发现
      operationId: set_cloud_auto_discovery
      tags: [安全]
      security:
      - SessionAuth: []
        CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 自动发现开关已保存
          content:
            application/json:
              schema:
                type: object
                properties:
                  auto_discover: {type: boolean}
  "/security/cloud-vaults":
    get:
      summary: 待连接节点扫描已验证账号中的云端连接入口
      operationId: list_cloud_vaults
      tags: [安全]
      description: 不解密候选；最多检查100个库目录，扫描限时50秒。
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 候选备份库与账号标识
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        vault_id: {type: string}
                        account_ids: {type: array, items: {type: string}}
                  failed_accounts: {type: array, items: {type: string}}
  "/security/cloud-connect":
    post:
      summary: 使用原备份密码认证云端身份并建立恢复节点
      operationId: join_cloud_vault
      tags: [安全]
      security:
      - SessionAuth: []
        CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - "$ref": "#/components/schemas/CloudPassword"
              - type: object
                required: [vault_id]
                properties:
                  vault_id:
                    type: string
                    pattern: '^[0-9a-f]{32}$'
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 已连接并默认开启自动发现；发现未入队时以discovery_error另行报告
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: {type: boolean}
                  vault_id: {type: string}
                  task:
                    "$ref": "#/components/schemas/Task"
                  discovery_error: {type: string}
        '400':
          "$ref": "#/components/responses/APIError"
        '429':
          "$ref": "#/components/responses/APIError"
components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: vaultpilot_session
      description: HttpOnly、SameSite=Lax的12小时管理会话；公开HTTPS时Secure。
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 由登录或已认证status响应取得，所有认证写请求必需。
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 500
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
      description: 同一任务类型及计划范围内重复键返回原任务；建议每次新操作生成新键。
  responses:
    HostInvalid:
      description: 请求 Host 不在回环、VP_PUBLIC_URL 或 VP_ALLOWED_HOSTS 允许范围，错误码 host_invalid
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    APIError:
      description: 稳定错误码、中文说明及是否可重试。Google新增shared_storage_group（409）、duplicate_cloud_folder（409）、cloud_storage_full（409）；任务可能返回CLOUD_API_RATE_LIMITED（可重试）、CLOUD_DAILY_UPLOAD_LIMIT（不可重试）和DUPLICATE_STORAGE_GROUP。
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    CloudPassword:
      description: 请求体最多8KiB
      type: object
      required: [password]
      properties:
        password:
          type: string
          writeOnly: true
          description: 原备份库保护密码，12至1024 Bytes；不会保存到任务或日志
    CloudConnectionState:
      type: object
      properties:
        pending: {type: boolean}
        recovery: {type: boolean}
        enabled: {type: boolean}
        auto_discover: {type: boolean}
        interval_seconds: {type: integer, const: 60}
        last_checked: {type: string}
        last_success: {type: string}
        last_error: {type: string}
    RcloneAuthFlow:
      type: object
      properties:
        id: {type: string}
        account_id: {type: string}
        status:
          type: string
          enum: [starting, waiting, exchanging, cancelling, completed, failed, cancelled]
        custom_client: {type: boolean, description: 当前授权是否使用该账号的自有 Google 客户端}
        expires_at: {type: string, format: date-time}
        message: {type: string}
        authorization_url: {type: string, description: 仅等待授权阶段可用的官方 Google/微软 URL，且不包含凭据}
        account:
          anyOf:
          - {"$ref": "#/components/schemas/Account"}
          - {type: 'null'}
    Error:
      type: object
      properties:
        error:
          type: string
          description: 中文用户说明
        code:
          type: string
          description: 稳定错误码；平台使用snake_case，引擎使用大写码
        retryable:
          type: boolean
      required:
      - error
      - code
      - retryable
    EmptyRequest:
      type: object
      properties: {}
    Status:
      description: 未登录仅返回 initialized 和 authenticated；其余属性仅已登录时返回
      type: object
      properties:
        cloud_pending:
          type: boolean
          description: 已初始化管理员但尚未连接云端备份库
        initialized:
          type: boolean
        authenticated:
          type: boolean
        csrf_token:
          type: string
          description: 仅已登录会话返回，所有认证写请求使用
        unlocked:
          type: boolean
        vault_id:
          type: string
        mode:
          type: string
          enum:
          - create
          - recovery
          - cloud
        engines:
          type: object
          properties:
            restic:
              type: boolean
            rclone:
              type: boolean
          required:
          - restic
          - rclone
        oauth_configured:
          type: boolean
        allow_local:
          type: boolean
        source_roots:
          type:
          - array
          - 'null'
          items:
            type: string
        restore_roots:
          type:
          - array
          - 'null'
          items:
            type: string
        cache_max_bytes:
          type: integer
          format: int64
          minimum: 1
          description: 仅已登录返回，实际配置的缓存容量阈值
        log_max_rows:
          type: integer
          format: int64
          minimum: 100
          description: 仅已登录返回，日志保留行数配置
        maintenance_window:
          type: string
          description: 仅已登录返回；空表示不限，否则HH:MM-HH:MM，可跨午夜
        account_clear_pending:
          type: array
          items: {type: string}
          description: 仅登录后返回，未完成清空的原账号组；重试完成前其他任务被阻止
        maintenance_timezone:
          type: string
          description: 仅已登录返回，IANA时区
      required:
      - initialized
      - authenticated
    RecoveryKit:
      type: object
      properties:
        format:
          type: string
          const: vaultpilot-recovery
        version:
          type: integer
          format: int64
          const: 1
        kdf:
          type: string
          const: argon2id
        salt:
          type: string
          description: Base64盐
        time:
          type: integer
          format: int64
          const: 3
        memory_kib:
          type: integer
          format: int64
          const: 65536
        parallelism:
          type: integer
          format: int64
          const: 2
        ciphertext:
          type: string
          description: Base64认证加密载荷；不包含OAuth Token
      required:
      - format
      - version
      - kdf
      - salt
      - time
      - memory_kib
      - parallelism
      - ciphertext
    SetupRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          writeOnly: true
          description: 最少12 Bytes、最多1024 Bytes；登录凭据和恢复凭据分别设置。
        recovery_password:
          type: string
          writeOnly: true
          description: 最少12 Bytes、最多1024 Bytes；登录凭据和恢复凭据分别设置。
        mode:
          type: string
          enum:
          - create
          - recovery
          - cloud
          default: create
        recovery_kit:
          oneOf:
          - "$ref": "#/components/schemas/RecoveryKit"
          - type: string
            description: 完整恢复包JSON字符串
      description: create/recovery模式的密码分别最少12 Bytes且必须不同。recovery需提供恢复包及该包保护密码。cloud模式仅创建本地管理员，连接云端后安装原备份库身份。
      allOf:
      - if:
          properties:
            mode:
              const: recovery
          required:
          - mode
        then:
          required:
          - recovery_kit
      - if:
          not:
            properties:
              mode:
                const: cloud
            required:
            - mode
        then:
          required:
          - recovery_password
      required:
      - username
      - password
    SetupResult:
      type: object
      properties:
        cloud_pending:
          type: boolean
        vault_id:
          type: string
        mode:
          type: string
          enum:
          - create
          - recovery
          - cloud
        csrf_token:
          type: string
        unlocked:
          type: boolean
      required:
      - vault_id
      - mode
      - csrf_token
      - unlocked
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - username
      - password
    Session:
      type: object
      properties:
        csrf_token:
          type: string
        unlocked:
          type: boolean
      required:
      - csrf_token
      - unlocked
    RecoveryExportRequest:
      type: object
      required: [password, admin_password]
      properties:
        password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true, description: 本次恢复包保护密码}
        admin_password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true, description: 当前管理员登录密码}
    PasswordRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          description: 最少12 Bytes、最多1024 Bytes；登录凭据和恢复凭据分别设置。
      required:
      - password
    UnlockState:
      type: object
      properties:
        unlocked:
          type: boolean
      required:
      - unlocked
    AccountCreate:
      type: object
      properties:
        storage_group:
          type: string
          maxLength: 64
          description: 仅gdrive；去除首尾空白，同一非空共享存储组不能加入同一池。更新省略时保留，空串清除。
        name:
          type: string
          minLength: 1
          maxLength: 200
        backend:
          type: string
          enum:
          - onedrive
          - gdrive
          - local
          default: onedrive
        budget_bytes:
          type: integer
          format: int64
          minimum: 1
          description: 项目容量上限Bytes
        cloud_reserve_bytes:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: 云端安全预留Bytes
        maintenance_reserve_bytes:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: 项目维护预留Bytes，必须小于budget_bytes
        local_path:
          type: string
          description: local账号必须提供已存在的真实目录；仅VP_ALLOW_LOCAL=true可用
      description: 云盘未指定预算时默认1TiB；创建后仍需授权与显式Drive验证。本地账号需预算和目录，并执行真实读写及磁盘容量查询。
      allOf:
      - if:
          properties:
            backend:
              const: local
          required:
          - backend
        then:
          required:
          - local_path
          - budget_bytes
      required:
      - name
    AccountUpdate:
      type: object
      properties:
        storage_group:
          type: string
          maxLength: 64
          description: 仅gdrive；去除首尾空白，同一非空共享存储组不能加入同一池。更新省略时保留，空串清除。
        name:
          type: string
