      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmptyRequest"
  "/accounts/{id}/rclone/authorize":
    parameters:
    - "$ref": "#/components/parameters/ResourceID"
    post:
      summary: 启动云盘 Rclone 标准授权（可按账号使用 Google 客户端）
      operationId: start_rclone_authorize
      tags: [账号]
      security:
      - SessionAuth: []
        CSRFToken: []
      description: 实际子进程使用 Rclone 内置应用；Google 可按账号提交自有桌面应用的 client_id 与原始 client_secret。省略客户端字段时复用该账号已保存的客户端，首次未配置时使用共享应用；两个字段必须成对提供。一个活动授权，10 分钟期限。返回 id 用于 flow_id 查询；未完成会话不跨重启。客户端 Secret 不进入响应、命令行参数或日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 1}
                client_id: {type: string, maxLength: 1024, description: Google 自有桌面应用客户端 ID；与 client_secret 成对，省略时复用已保存客户端}
                client_secret: {type: string, format: password, maxLength: 4096, description: Google 原始客户端密钥；不回显、不写日志}
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '202':
          description: 已启动，继续轮询
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RcloneAuthFlow"}
        '409': {"$ref": "#/components/responses/APIError"}
    get:
      summary: 查询本登录会话所属的 Rclone 授权状态
      operationId: get_rclone_authorize
      tags: [账号]
      parameters:
      - {name: flow_id, in: query, required: true, schema: {type: string}}
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 状态、Google/微软授权 URL 或完成后的账号；不包含凭据
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RcloneAuthFlow"}
        '404': {"$ref": "#/components/responses/APIError"}
    delete:
      summary: 取消本次 Rclone 授权子进程
      operationId: cancel_rclone_authorize
      tags: [账号]
      security:
      - SessionAuth: []
        CSRFToken: []
      parameters:
      - {name: flow_id, in: query, required: true, schema: {type: string}}
      responses:
        '421':
          "$ref": "#/components/responses/HostInvalid"
        '200':
          description: 已请求取消，轮询至 cancelled
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RcloneAuthFlow"}
        '404': {"$ref": "#/components/responses/APIError"}
  "/accounts/{id}/rclone/callback":
